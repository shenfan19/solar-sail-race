<!doctype html>
<html lang="en" data-version="0.3.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Solar Sail Race</title>
<meta name="description" content="A non-real-time racing game about solar sails. Sunlight pushes the sail, gravity bends its path.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* One palette for the page and the canvas: game.js reads the --c-* colors when it draws. */
  :root {
    --space:#0a0d14; --panel:rgba(15,19,28,0.92); --line:#2a3242; --line-soft:rgba(42,50,66,0.6);
    --text:#e2e5ea; --muted:#8a92a2; --faint:#4a5263;
    --sun:#d4a24c; --accent:#86a9c8; --pink:#c27b92; --green:#7fb38e; --red:#c76d6d; --gold:#d2b15e;
    --c-star:#aeb8cc; --c-ring:#2c3547; --c-goal:#c27b92; --c-orbit:#86a9c8; --c-node:#c27b92;
    --c-axis-x:#6a3c42; --c-axis-y:#3d6448; --c-axis-z:#3c5068;
    --c-sun:#e2b060; --c-earth:#4f78a8; --c-shadow:#9aa0b4; --c-ghost:#9aa3c4; --c-trail:#d4a24c;
    --c-predict:#7fb38e; --c-sail:#a9c3dc; --c-craft:#f2f4f7; --c-normal:#c76d6d; --c-light:#d9be6a;
    --c-guide:#7fb38e; --c-pad:#8a92a2; --c-tether:#b8a6d9;
    --c-star-G:#e2b060; --c-star-K:#d9884f; --c-star-F:#ece3b8; --c-star-A:#c9d8f2; --c-star-M:#c45a4a;
    --display:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; --body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--space); color:var(--text); font-family:var(--body); font-weight:400; overflow:hidden; user-select:none; -webkit-user-select:none; }
  #stage { position:relative; width:100vw; height:100vh; height:100dvh; background:radial-gradient(ellipse at 50% 40%, #121826 0%, var(--space) 70%); }
  #view { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  .hidden { display:none !important; }
  .screen { position:absolute; inset:0; pointer-events:none; }
  .screen > * { pointer-events:auto; }

  h1, h2, .display { font-family:var(--display); font-weight:600; letter-spacing:0.01em; margin:0; }
  .title { font-size:clamp(34px, 5.6vw, 64px); line-height:1.05; color:var(--text); }
  .subtitle { font-size:clamp(15px, 1.6vw, 19px); color:var(--muted); letter-spacing:0.12em; margin-top:6px; }
  .lead-home { max-width:720px; margin:14px auto 0; font-size:clamp(16px, 1.8vw, 20px); line-height:1.5; color:var(--text); }
  .feats { display:flex; flex-wrap:wrap; justify-content:center; gap:8px 22px; margin-top:12px; font-size:clamp(13px, 1.4vw, 15px); color:var(--muted); }
  .feats span::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--sun); margin-right:8px; vertical-align:middle; }

  .btn { font-family:var(--body); font-weight:500; font-size:clamp(14px, 1.4vw, 16px); color:var(--text);
         background:#141a26; border:1px solid var(--line); border-radius:6px; padding:10px 18px; cursor:pointer; transition:border-color .1s, background .1s; }
  .btn:hover, .btn:focus-visible { outline:none; border-color:var(--accent); background:#18202e; }
  .btn.primary { background:var(--sun); border-color:var(--sun); color:#16120a; font-weight:600; }
  .btn.primary:hover, .btn.primary:focus-visible { background:#e0b462; border-color:#f0d39a; }
  .btn.small { font-size:13px; padding:6px 11px; border-radius:5px; }
  .btn.on { border-color:var(--accent); color:var(--accent); }

  /* menu */
  /* the menu scrolls by itself on short screens, so it takes touches instead of passing them to the canvas behind */
  /* The menu always fits one screen: the footer with the credits stays at the bottom, and if missions ever outgrow
     the space only the mission list scrolls. Phones get compact two-line mission rows (see the media query below). */
  #menu { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:5vh 4vw calc(2vh + env(safe-area-inset-bottom, 0px)); text-align:center; gap:2vh; overflow:hidden; pointer-events:auto; touch-action:pan-y; }
  #menu > * { flex-shrink:0; }
  #levels { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-content:flex-start; margin-top:1vh; flex:0 1 auto !important; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; width:100%; }
  .card { width:min(290px, 86vw); text-align:left; padding:16px 18px; border-radius:8px; background:var(--panel); border:1px solid var(--line); color:var(--text); cursor:pointer; font-family:var(--body); transition:border-color .1s, transform .1s; }
  .card:hover, .card:focus-visible { outline:none; transform:translateY(-2px); border-color:var(--accent); }
  .card .num { font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:0.12em; text-transform:uppercase; }
  .card .name { font-weight:600; font-size:19px; margin:6px 0 8px; line-height:1.25; }
  .card .goal { font-size:15px; color:var(--muted); min-height:42px; line-height:1.35; }
  .card .row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; font-size:14px; }
  .card .best { flex:1; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag { font-size:12px; letter-spacing:0.04em; padding:2px 8px; border-radius:4px; border:1px solid currentColor; }
  .tag.Easy { color:var(--green); } .tag.Medium { color:var(--sun); } .tag.Hard { color:var(--pink); }
  .stars { font-size:18px; letter-spacing:3px; color:var(--faint); }
  .stars b { color:var(--gold); font-weight:400; }
  #modeTabs { display:flex; gap:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  #modeTabs .btn { border:0; border-radius:0; padding:7px 16px; background:transparent; color:var(--muted); }
  #modeTabs .btn.on { background:#1b2433; color:var(--text); box-shadow:inset 0 -2px 0 var(--sun); }
  .fiction { font-size:14px; color:var(--muted); border-left:3px solid var(--pink); padding:6px 12px; margin:0 0 14px; line-height:1.45; }
  #garageHulls, #garageMechs { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
  #garage .opt { align-items:flex-start; } #garage .opt > span { padding-top:5px; white-space:nowrap; }
  #garageDesc { font-size:14px; color:var(--muted); line-height:1.5; margin:12px 0 0; } #garageDesc b { color:var(--text); font-weight:500; }
  #garageWarn:empty { display:none; }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }
  #menuBtns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #menuFoot { margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--muted); font-size:14px; }
  #menuFoot .links { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 14px; }
  #menuFoot a, #menuFoot button.link { color:var(--muted); text-decoration:none; background:none; border:0; font:inherit; cursor:pointer; padding:0; }
  #menuFoot a:hover, #menuFoot button.link:hover, #menuFoot a:focus-visible, #menuFoot button.link:focus-visible { color:var(--text); outline:none; text-decoration:underline; }
  select.lang { font:inherit; font-size:14px; color:var(--muted); background:#141a26; border:1px solid var(--line); border-radius:5px; padding:3px 6px; }

  /* centered cards for brief, pause, result, settings, help, about */
  .center { display:flex; align-items:center; justify-content:center; padding:3vh 4vw; background:rgba(6,8,13,0.6); pointer-events:auto; }
  .sheet { scrollbar-color:var(--line) transparent; width:min(740px, 94vw); max-height:94vh; max-height:94dvh; overflow:auto; touch-action:pan-y; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:clamp(18px, 3vw, 32px); box-shadow:0 16px 60px rgba(0,0,0,0.5); }
  .sheet h2 { font-size:clamp(22px, 3vw, 32px); }
  .sheet .lead { font-size:clamp(17px, 1.9vw, 21px); color:var(--accent); margin:10px 0 14px; line-height:1.4; }
  .sheet ol { margin:0 0 18px; padding-left:24px; font-size:clamp(15px, 1.7vw, 18px); line-height:1.5; }
  .sheet ol li { margin:6px 0; }
  .sheet .btns { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .sheet .opt { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:17px; padding:9px 0; border-bottom:1px solid var(--line-soft); }
  .sheet .opt select { font:inherit; font-size:15px; color:var(--text); background:#141a26; border:1px solid var(--line); border-radius:5px; padding:5px 8px; }
  .sheet p.about { font-size:clamp(15px, 1.7vw, 18px); line-height:1.5; margin:0 0 12px; }
  .sheet p.small { color:var(--muted); font-size:14px; margin-top:14px; line-height:1.45; }
  .sheet a { color:var(--accent); }
  .sheet table { border-collapse:collapse; font-size:16px; width:100%; }
  .sheet td { padding:7px 8px; border-bottom:1px solid var(--line-soft); line-height:1.4; } .sheet td:first-child { color:var(--accent); font-size:13px; white-space:nowrap; letter-spacing:0.04em; }

  /* result */
  #resultTitle { font-size:clamp(24px, 3.4vw, 38px); }
  #resultTitle.ok { color:var(--green); } #resultTitle.bad { color:var(--red); }
  #medals { font-size:clamp(34px, 5vw, 52px); letter-spacing:10px; color:var(--faint); margin:2px 0; line-height:1.1; }
  #medals b { color:var(--gold); font-weight:400; }
  .bigtime { font-family:var(--mono); font-size:clamp(34px, 5vw, 56px); color:var(--text); }
  .bigtime small { font-family:var(--body); font-size:0.4em; color:var(--muted); margin-left:8px; }
  .banner { display:inline-block; font-size:14px; letter-spacing:0.08em; color:#16120a; background:var(--gold); padding:3px 12px; border-radius:4px; margin:6px 0; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin:14px 0 6px; }
  .stat { background:rgba(8,10,16,0.6); border:1px solid var(--line); border-radius:6px; padding:10px 14px; }
  .stat .k { font-size:13px; color:var(--muted); } .stat .v { font-family:var(--mono); font-size:21px; }
  #resultMsg { font-size:18px; color:var(--muted); margin:8px 0; }

  /* hud */
  #hud { pointer-events:none; }
  #hud > * { pointer-events:none; }
  #hud .interactive, #hud .interactive * { pointer-events:auto; }
  #hudTop { position:absolute; top:0; left:0; right:0; display:flex; gap:20px; align-items:flex-start; padding:14px 18px; background:linear-gradient(180deg, rgba(6,8,13,0.8), transparent); }
  #lvlName { font-size:clamp(13px, 1.4vw, 16px); color:var(--muted); letter-spacing:0.04em; }
  #timer { font-family:var(--mono); font-size:clamp(30px, 4.4vw, 52px); line-height:1.1; }
  #timer small { font-family:var(--body); font-size:0.38em; color:var(--muted); margin-left:6px; }
  #goalBox { flex:1; max-width:520px; margin-left:auto; }
  #goalLabel { font-size:clamp(15px, 1.6vw, 19px); display:flex; justify-content:space-between; gap:12px; }
  #goalLabel span:last-child { color:var(--sun); font-family:var(--mono); }
  #goalBar { height:8px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden; margin-top:6px; border:1px solid var(--line); }
  #goalBar i { display:block; height:100%; width:0; background:var(--sun); }
  #hudViews { position:absolute; top:96px; right:18px; display:flex; flex-direction:column; gap:7px; align-items:flex-end; }
  #hudViews .row { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  #padBox { position:absolute; left:18px; bottom:56px; width:clamp(130px, 17vw, 190px); }
  #pad { width:100%; aspect-ratio:1; display:block; border-radius:50%; background:radial-gradient(circle, rgba(134,169,200,0.07), rgba(8,10,16,0.85)); border:1px solid var(--line); touch-action:none; cursor:crosshair; }
  #padBox.nudge #pad { animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(134,169,200,0.45); } 50% { box-shadow:0 0 0 10px rgba(134,169,200,0); } }
  #padLabel { text-align:center; font-size:12px; letter-spacing:0.06em; color:var(--muted); margin-top:6px; }
  #angles { text-align:center; font-family:var(--mono); font-size:14px; color:var(--accent); }
  #coach { position:absolute; left:50%; bottom:58px; transform:translateX(-50%); width:min(560px, 46vw); text-align:center; font-size:clamp(16px, 1.9vw, 22px); font-weight:500; line-height:1.35;
           background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:6px; padding:10px 18px; }
  #coach:empty { display:none; }
  #hudBtns { position:absolute; right:18px; bottom:56px; display:flex; gap:8px; align-items:center; }
  #speedLabel { font-family:var(--mono); font-size:16px; min-width:52px; text-align:center; }
  #keyhints { position:absolute; left:0; right:0; bottom:0; padding:8px 18px; font-size:14px; color:var(--muted); background:linear-gradient(0deg, rgba(6,8,13,0.85), transparent); text-align:center; }
  kbd { font-family:var(--mono); font-size:12px; border:1px solid var(--line); border-radius:4px; padding:1px 6px; color:var(--text); background:#141a26; margin:0 4px 0 12px; }
  @media (max-width: 600px), (max-height: 620px) {
    #menu { padding:3vh 14px calc(10px + env(safe-area-inset-bottom, 0px)); gap:12px; }
    .title { font-size:28px; } .subtitle { font-size:13px; margin-top:2px; }
    .lead-home { font-size:14px; line-height:1.45; margin-top:8px; }
    .feats { font-size:12px; gap:4px 14px; margin-top:8px; }
    #levels { gap:8px; margin-top:0; }
    #modeTabs .btn { padding:5px 12px; font-size:13px; }
    .card { width:100%; max-width:420px; padding:9px 12px; border-radius:6px; }
    .card:hover, .card:focus-visible { transform:none; }
    .card .num { display:inline; font-size:11px; margin-right:8px; }
    .card .name { display:inline; font-size:15px; margin:0; }
    .card .goal { display:none; }
    .card .row { margin-top:5px; font-size:12px; } .card .stars { font-size:14px; letter-spacing:2px; } .tag { font-size:11px; padding:1px 6px; }
    #menuBtns { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; width:100%; max-width:420px; } #menuBtns .btn { padding:7px 6px; font-size:13px; line-height:1.25; }
    #menuFoot { gap:4px; font-size:12px; } #pads { display:none; } select.lang { font-size:12px; }
  }
  @media (max-width: 600px) and (max-height: 600px) { .feats { display:none; } }
  /* very short phones: one line per mission card, the stars stand in for the best time */
  @media (max-height: 600px) and (max-width: 600px) { .card { display:flex; align-items:center; gap:8px; } .card .row { margin:0 0 0 auto; flex-shrink:0; } .card .best { display:none; } .card .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } }
  @media (max-width: 760px) { #hudViews { top:auto; bottom:210px; } #coach { width:92vw; bottom:210px; } #keyhints { display:none; } #padBox { bottom:14px; } #hudBtns { bottom:14px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>

  <!-- title and level select -->
  <div id="menu" class="screen">
    <div>
      <h1 class="title" data-i18n="menu.title">Solar Sail Race</h1>
      <div class="subtitle" data-i18n="menu.subtitle">谁谓河广</div>
      <div class="lead-home" data-i18n="menu.lead"></div>
      <div class="feats"><span data-i18n="menu.feat1"></span><span data-i18n="menu.feat2"></span><span data-i18n="menu.feat3"></span></div>
    </div>
    <div id="modeTabs" role="group"><button class="btn" data-mode="sim" data-i18n="menu.tabSim"></button><button class="btn" data-mode="race" data-i18n="menu.tabRace"></button></div>
    <div id="levels"></div>
    <div id="menuBtns">
      <button class="btn" id="btnHelp" data-i18n="menu.help"></button>
      <button class="btn" id="btnGhostCode" data-i18n="menu.ghostCode"></button>
      <button class="btn" id="btnSettings" data-i18n="menu.settings"></button>
    </div>
    <div id="menuFoot">
      <div id="pads"></div>
      <div class="links">
        <span data-i18n="menu.by"></span>
        <a href="https://github.com/shenfan19/solar-sail-race" target="_blank" rel="noopener" data-i18n="menu.source"></a>
        <button class="link" id="btnAbout" data-i18n="menu.about"></button>
        <span class="ver-tag">v<span class="ver"></span></span>
        <select class="lang" id="selLangHome" aria-label="Language"></select>
      </div>
    </div>
  </div>

  <!-- mission briefing -->
  <div id="brief" class="screen center hidden">
    <div class="sheet">
      <div id="briefNum" style="color:var(--muted);font-family:var(--mono);letter-spacing:0.1em;font-size:13px;text-transform:uppercase"></div>
      <h2 id="briefName"></h2>
      <div class="lead" id="briefGoal"></div>
      <p class="fiction hidden" id="briefFiction" data-i18n="brief.fiction"></p>
      <ol id="briefSteps"></ol>
      <div class="opt"><span data-i18n="brief.craft"></span><button class="btn small" id="btnBriefCraft"></button></div>
      <div class="opt"><span data-i18n="brief.guide"></span><button class="btn small on" id="btnBriefGuide"></button></div>
      <div class="opt"><span data-i18n="brief.ghost"></span><button class="btn small" id="btnBriefGhost"></button></div>
      <div class="btns">
        <button class="btn primary" id="btnLaunch" data-i18n="brief.launch"></button>
        <button class="btn" id="btnBriefBack" data-i18n="back"></button>
      </div>
    </div>
  </div>

  <!-- hangar: sail type and attitude mechanisms -->
  <div id="garage" class="screen center hidden">
    <div class="sheet">
      <h2 data-i18n="garage.title"></h2>
      <div class="opt"><span data-i18n="garage.hull"></span><div id="garageHulls"></div></div>
      <div class="opt"><span data-i18n="garage.mechs"></span><div id="garageMechs"></div></div>
      <p class="small" data-i18n="garage.mechsNote"></p>
      <table id="garageStats"></table>
      <p id="garageDesc"></p>
      <p class="fiction" id="garageWarn"></p>
      <p class="small" data-i18n="garage.note"></p>
      <div class="btns"><button class="btn primary" id="btnGarageDone" data-i18n="set.done"></button></div>
    </div>
  </div>

  <!-- in-game overlay -->
  <div id="hud" class="screen hidden">
    <div id="hudTop">
      <div><div id="lvlName"></div><div id="timer">0.0</div></div>
      <div id="goalBox"><div id="goalLabel"><span id="goalText"></span><span id="goalVal"></span></div><div id="goalBar"><i></i></div></div>
    </div>
    <div id="hudViews" class="interactive">
      <div class="row" id="presets"></div>
      <div class="row"><button class="btn small" id="btnSplit" data-i18n="hud.split"></button><button class="btn small" id="btnFollow" data-i18n="hud.follow"></button></div>
    </div>
    <div id="padBox" class="interactive">
      <canvas id="pad" width="380" height="380"></canvas>
      <div id="padLabel" data-i18n="hud.padLabel"></div>
      <div id="angles"></div>
    </div>
    <div id="coach"></div>
    <div id="hudBtns" class="interactive">
      <button class="btn small" id="btnGuide" data-i18n="hud.guide"></button>
      <button class="btn small" id="btnSlower">&minus;</button><span id="speedLabel">1x</span><button class="btn small" id="btnFaster">+</button>
      <button class="btn small" id="btnPause"></button>
    </div>
    <div id="keyhints"></div>
  </div>

  <!-- pause -->
  <div id="pause" class="screen center hidden">
    <div class="sheet" style="text-align:center">
      <h2 data-i18n="pause.title"></h2>
      <div class="btns" style="justify-content:center">
        <button class="btn primary" id="btnResume" data-i18n="hud.resume"></button>
        <button class="btn" id="btnRestart" data-i18n="pause.restart"></button>
        <button class="btn" id="btnQuit" data-i18n="pause.menu"></button>
      </div>
    </div>
  </div>

  <!-- results -->
  <div id="result" class="screen center hidden">
    <div class="sheet" style="text-align:center">
      <h2 id="resultTitle"></h2>
      <div id="medals"></div>
      <div class="bigtime"><span id="resultTime"></span><small id="resultUnit"></small></div>
      <div id="resultBanner"></div>
      <div id="resultMsg"></div>
      <div id="resultCraft" style="color:var(--muted);font-size:14px"></div>
      <div class="stats" id="resultStats"></div>
      <div class="btns" style="justify-content:center">
        <button class="btn primary" id="btnNext" data-i18n="res.next"></button>
        <button class="btn" id="btnRetry" data-i18n="res.retry"></button>
        <button class="btn" id="btnCopy" data-i18n="res.copy"></button>
        <button class="btn" id="btnResultMenu" data-i18n="pause.menu"></button>
      </div>
    </div>
  </div>

  <!-- settings -->
  <div id="settings" class="screen center hidden">
    <div class="sheet">
      <h2 data-i18n="set.title"></h2>
